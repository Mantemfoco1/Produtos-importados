<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos Importados</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            color: #ddd;
        }

        .topo {
            position: sticky;
            top: 0;
            z-index: 100;
            background: white;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .controles {
            max-width: 1200px;
            margin: auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controles input,
        .controles select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .controles input {
            width: 300px;
        }

        .categorias {
            max-width: 1200px;
            margin: 20px auto;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 0 15px;
        }

        .categorias button {
            border: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
        }

        .categorias button:hover {
            background: #444;
        }

        .promocao {
            max-width: 1200px;
            margin: 20px auto;
            padding: 18px;
            background: #111;
            color: white;
            border-radius: 12px;
            text-align: center;
        }

        .promocao strong {
            font-size: 24px;
        }

        .produtos {
            max-width: 1200px;
            margin: 20px auto 100px;
            padding: 0 15px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .produto {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
            transition: transform 0.2s;
            position: relative;
        }

        .produto:hover {
            transform: translateY(-4px);
        }

        .desconto {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #d60000;
            color: white;
            padding: 7px 10px;
            border-radius: 6px;
            font-weight: bold;
            z-index: 2;
        }

        .produto img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .info {
            padding: 18px;
        }

        .categoria {
            font-size: 13px;
            color: #777;
            margin-bottom: 5px;
        }

        .produto h2 {
            margin: 5px 0 10px;
            font-size: 19px;
        }

        .descricao {
            color: #666;
            font-size: 14px;
            min-height: 40px;
        }

        .preco-antigo {
            text-decoration: line-through;
            color: #999;
            font-size: 15px;
            margin-top: 12px;
        }

        .preco {
            color: #111;
            font-size: 25px;
            font-weight: bold;
            margin: 5px 0 15px;
        }

        .botao {
            width: 100%;
            border: none;
            background: #111;
            color: white;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .botao:hover {
            background: #333;
        }

        .carrinho {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #111;
            color: white;
            padding: 15px 20px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-conteudo {
            background: white;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 15px;
            padding: 25px;
        }

        .modal-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fechar {
            font-size: 30px;
            cursor: pointer;
        }

        .item-carrinho {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .item-carrinho button {
            background: #d60000;
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }

        .whatsapp {
            width: 100%;
            background: #25D366;
            border: none;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .vazio {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: #777;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 900px) {
            .produtos {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 25px;
            }

            .produtos {
                grid-template-columns: 1fr;
            }

            .produto img {
                height: 300px;
            }

            .controles input {
                width: 100%;
            }

            .controles select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🛍️ Produtos Importados</h1>
    <p>Produtos selecionados com preços especiais</p>
</header>

<div class="topo">
    <div class="controles">

        <input
            type="text"
            id="pesquisa"
            placeholder="🔎 Buscar produto..."
            oninput="mostrarProdutos()"
        >

        <select id="ordenacao" onchange="mostrarProdutos()">
            <option value="padrao">Ordenar produtos</option>
            <option value="menor">Menor preço</option>
            <option value="maior">Maior preço</option>
            <option value="nome">Nome A-Z</option>
        </select>

    </div>
</div>

<div class="categorias">
    <button onclick="filtrarCategoria('Todos')">Todos</button>
    <button onclick="filtrarCategoria('Perfume')">Perfumes</button>
    <button onclick="filtrarCategoria('Eletrônicos')">Eletrônicos</button>
    <button onclick="filtrarCategoria('Acessórios')">Acessórios</button>
    <button onclick="filtrarCategoria('Beleza')">Beleza</button>
</div>

<div class="promocao">
    <strong>🔥 OFERTA ESPECIAL</strong>
    <br>
    <span>20% de desconto em todos os produtos!</span>
</div>

<div class="produtos" id="listaProdutos"></div>

<div class="carrinho" onclick="abrirCarrinho()">
    🛒 Carrinho (<span id="quantidadeCarrinho">0</span>)
</div>

<div class="modal" id="modalCarrinho">

    <div class="modal-conteudo">

        <div class="modal-topo">
            <h2>🛒 Seu Carrinho</h2>
            <span class="fechar" onclick="fecharCarrinho()">×</span>
        </div>

        <div id="itensCarrinho"></div>

        <div class="total">
            Total: R$ <span id="totalCarrinho">0,00</span>
        </div>

        <button class="whatsapp" onclick="finalizarWhatsApp()">
            📱 Finalizar pedido pelo WhatsApp
        </button>

    </div>

</div>

<footer>
    <p>Produtos Importados © 2026</p>
    <p>20% OFF em todos os produtos</p>
</footer>

<script>

    // =========================
    // WHATSAPP
    // =========================

    const WHATSAPP = "5511970218569";


    // =========================
    // PRODUTOS
    // =========================

    const produtos = [

        {
            id: 1,
            nome: "212 VIP Men",
            categoria: "Perfume",
            preco: 399.90,
            imagem: "https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=800&q=80",

        },

        {

            nome: "212 VIP Black",

            descricao: "Fragrância masculina marcante."
        },

        {
            id: 3,
            nome: "212 Men NYC",
            categoria: "Perfume",

            descricao: "Perfume masculino sofisticado."
        },

        {
            id: 4,
            nome: "Perfume Importado Classic",
            categoria: "Perfume",
            preco: 329.90,
            imagem: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=800&q=80",
            descricao: "Fragrância elegante para diversas ocasiões."
        },

        {
            id: 5,
            nome: "Perfume Black Edition",
            categoria: "Perfume",
            preco: 429.90,
            imagem: "https://images.unsplash.com/photo-1619994403073-2cec844b8e63?auto=format&fit=crop&w=800&q=80",
            descricao: "Fragrância intensa e sofisticada."
        },

        {
            id: 6,
            nome: "Smartwatch Series",
            categoria: "Eletrônicos",
            preco: 299.90,
            imagem: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80",
            descricao: "Smartwatch moderno para o dia a dia."
        },

        {
            id: 7,
            nome: "Fone Bluetooth Pro",
            categoria: "Eletrônicos",
            preco: 249.90,
            imagem: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80",

        },

        {
            id: 8,
            nome: "Headphone Wireless",

            preco: 349.90,
            imagem: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80",
            descricao: "Headphone confortável e moderno."
        },

        {
            id: 9,
            nome: "Caixa de Som Bluetooth",
            categoria: "Eletrônicos",
            preco: 279.90,
            imagem: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=800&q=80",
            descricao: "Caixa de som portátil Bluetooth."
        },

        {
            id: 10,
            nome: "Óculos de Sol Premium",
            categoria: "Acessórios",
            preco: 199.90,
            imagem: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=80",
            descricao: "Óculos de sol com visual moderno."
        },

        {
            id: 11,
            nome: "Relógio Masculino Premium",
            categoria: "Acessórios",
            preco: 499.90,
            imagem: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=800&q=80",
            descricao: "Relógio masculino elegante."
        },

        {
            id: 12,
            nome: "Carteira Masculina",
            categoria: "Acessórios",
            preco: 149.90,
            imagem: "https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=800&q=80",
            descricao: "Carteira compacta e sofisticada."
        },

        {
            id: 13,
            nome: "Kit Cuidados Masculinos",
            categoria: "Beleza",
            preco: 189.90,
            imagem: "https://images.unsplash.com/photo-1556228578-8c89e6adf883?auto=format&fit=crop&w=800&q=80",
            descricao: "Kit para cuidados pessoais."
        },

        {
            id: 14,
            nome: "Kit Skincare Premium",
            categoria: "Beleza",
            preco: 229.90,
            imagem: "https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=800&q=80",
            descricao: "Produtos para rotina de cuidados."
        },

        {
            id: 15,
            nome: "Kit Perfume + Hidratante",
            categoria: "Beleza",
            preco: 359.90,
            imagem: "https://images.unsplash.com/photo-1611930022073-b7a4ba5fcccd?auto=format&fit=crop&w=800&q=80",
            descricao: "Kit especial com perfume e hidratante."
        }

    ];


    // =========================
    // DESCONTO
    // =========================

    const DESCONTO = 0.20;


    // =========================
    // CARRINHO
    // =========================

    let carrinho = [];

    let categoriaAtual = "Todos";


    // =========================
    // CALCULAR PREÇO
    // =========================

    function precoComDesconto(preco) {

        return preco * (1 - DESCONTO);

    }


    // =========================
    // FORMATAÇÃO
    // =========================

    function dinheiro(valor) {

        return valor.toLocaleString("pt-BR", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

    }


    // =========================
    // MOSTRAR PRODUTOS
    // =========================

    function mostrarProdutos() {

        const lista = document.getElementById("listaProdutos");

        const pesquisa =
            document.getElementById("pesquisa").value.toLowerCase();

        const ordenacao =
            document.getElementById("ordenacao").value;


        let produtosFiltrados = produtos.filter(produto => {

            const correspondeCategoria =
                categoriaAtual === "Todos" ||
                produto.categoria === categoriaAtual;

            const correspondePesquisa =
                produto.nome.toLowerCase().includes(pesquisa) ||
                produto.categoria.toLowerCase().includes(pesquisa);

            return correspondeCategoria && correspondePesquisa;

        });


        // ORDENAÇÃO

        if (ordenacao === "menor") {

            produtosFiltrados.sort(
                (a, b) =>
                precoComDesconto(a.preco) -
                precoComDesconto(b.preco)
            );

        }

        if (ordenacao === "maior") {

            produtosFiltrados.sort(
                (a, b) =>
                precoComDesconto(b.preco) -
                precoComDesconto(a.preco)
            );

        }

        if (ordenacao === "nome") {

            produtosFiltrados.sort(
                (a, b) =>
                a.nome.localeCompare(b.nome)
            );

        }


        lista.innerHTML = "";


        if (produtosFiltrados.length === 0) {

            lista.innerHTML = `
                <div class="vazio">
                    <h2>Nenhum produto encontrado</h2>
                    <p>Tente outra busca.</p>
                </div>
            `;

            return;

        }


        produtosFiltrados.forEach(produto => {

            const precoFinal =
                precoComDesconto(produto.preco);


            lista.innerHTML += `

                <div class="produto">

                    <div class="desconto">
                        20% OFF
                    </div>

                    <img
                        src="${produto.imagem}"
                        alt="${produto.nome}"
                    >

                    <div class="info">

                        <div class="categoria">
                            ${produto.categoria}
                        </div>

                        <h2>
                            ${produto.nome}
                        </h2>

                        <div class="descricao">
                            ${produto.descricao}
                        </div>

                        <div class="preco-antigo">
                            De: R$ ${dinheiro(produto.preco)}
                        </div>

                        <div class="preco">
                            R$ ${dinheiro(precoFinal)}
                        </div>

                        <button
                            class="botao"
                            onclick="adicionarCarrinho(${produto.id})"
                        >
                            🛒 Adicionar ao carrinho
                        </button>

                    </div>

                </div>

            `;

        });

    }


    // =========================
    // FILTRO DE CATEGORIA
    // =========================

    function filtrarCategoria(categoria) {

        categoriaAtual = categoria;

        mostrarProdutos();

    }


    // =========================
    // ADICIONAR AO CARRINHO
    // =========================

    function adicionarCarrinho(id) {

        const produto =
            produtos.find(p => p.id === id);


        const itemExistente =
            carrinho.find(item => item.id === id);


        if (itemExistente) {

            itemExistente.quantidade++;

        } else {

            carrinho.push({

                id: produto.id,

                nome: produto.nome,

                preco: precoComDesconto(produto.preco),

                quantidade: 1

            });

        }


        atualizarCarrinho();

        alert("Produto adicionado ao carrinho!");

    }


    // =========================
    // REMOVER DO CARRINHO
    // =========================

    function removerCarrinho(id) {

        carrinho =
            carrinho.filter(item => item.id !== id);

        atualizarCarrinho();

        mostrarCarrinho();

    }


    // =========================
    // ATUALIZAR CARRINHO
    // =========================

    function atualizarCarrinho() {

        const quantidade =
            carrinho.reduce(
                (total, item) =>
                total + item.quantidade,
                0
            );


        document.getElementById(
            "quantidadeCarrinho"
        ).textContent = quantidade;

    }


    // =========================
    // ABRIR CARRINHO
    // =========================

    function abrirCarrinho() {

        document.getElementById(
            "modalCarrinho"
        ).style.display = "flex";


        mostrarCarrinho();

    }


    // =========================
    // FECHAR CARRINHO
    // =========================

    function fecharCarrinho() {

        document.getElementById(
            "modalCarrinho"
        ).style.display = "none";

    }


    // =========================
    // MOSTRAR CARRINHO
    // =========================

    function mostrarCarrinho() {

        const container =
            document.getElementById("itensCarrinho");

        const totalElemento =
            document.getElementById("totalCarrinho");


        container.innerHTML = "";


        if (carrinho.length === 0) {

            container.innerHTML = `
                <p>Seu carrinho está vazio.</p>
            `;

            totalElemento.textContent = "0,00";

            return;

        }


        let total = 0;


        carrinho.forEach(item => {

            const subtotal =
                item.preco * item.quantidade;

            total += subtotal;


            container.innerHTML += `

                <div class="item-carrinho">

                    <div>

                        <strong>
                            ${item.nome}
                        </strong>

                        <br>

                        Quantidade:
                        ${item.quantidade}

                        <br>

                        R$ ${dinheiro(subtotal)}

                    </div>

                    <div>

                        <button
                            onclick="removerCarrinho(${item.id})"
                        >
                            Remover
                        </button>

                    </div>

                </div>

            `;

        });


        totalElemento.textContent =
            dinheiro(total);

    }


    // =========================
    // WHATSAPP
    // =========================

    function finalizarWhatsApp() {

        if (carrinho.length === 0) {

            alert("Seu carrinho está vazio.");

            return;

        }


        let mensagem =
            "Olá! Gostaria de fazer um pedido:%0A%0A";


        let total = 0;


        carrinho.forEach(item => {

            const subtotal =
                item.preco * item.quantidade;

            total += subtotal;


            mensagem +=
                `• ${item.nome} - Quantidade: ${item.quantidade} - R$ ${dinheiro(subtotal)}%0A`;

        });


        mensagem +=
            `%0A*Total: R$ ${dinheiro(total)}*`;



        const url =
            `https://wa.me/${WHATSAPP}?text=${mensagem}`;


        window.open(url, "_blank");

    }


    // =========================
    // INICIAR SITE
    // =========================

    mostrarProdutos();

    atualizarCarrinho();

</script>

</body>
</html>
